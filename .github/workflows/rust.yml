name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Setup Java JDK
      uses: actions/setup-java@v6.1.0
      with:
        java-version: latest
    - name: Run tests
      run: cargo test --verbose
